# ==============================================================================
# BASE CONFIGURATION: clinical-onco-profiler (Global Parameters)
# ==============================================================================

# --- System Setup ---
output_root: "results/0final"   # canonical runs; RUN_NAME sets the run dir (this config: nlr_v2_cc50, peer run, clinical model PD-L1 + NLR)
project_name: "base_run"
run_machine_learning: true
run_nested_loocv_validation: true
run_clinical_utility: true       # Step 06: calibration + decision curve + bootstrap optimism on the pre-specified composite (TRIPOD/REMARK layer)
run_nested_validation: true      # Step 06: re-select the LMM gate inside each outer LOO fold (anti-circularity / selection-optimism test); NSCLC only (needs clinical_model + longitudinal); ~1 min, additive
run_publication_figures: true    # Step 06: Frontiers-styled manuscript figure set (publication/ subdir; cairo_pdf, no titles, Okabe-Ito) — additive, driven by live objects
# NLR switch (clinical model of step 06): false = PD-L1 TPS alone (primary run);
# true = PD-L1 + NLR (nlr_v2_cc50 peer run, config/nlr_v2_cc50.yml). Env INCLUDE_NLR
# overrides it per run. No ECOG PS anywhere (PI decision, 2026-10-20). Increments are
# not comparable across clinical baselines (a weaker baseline gives a bigger increment).
# Results and frames: results/0final/README.md.
include_nlr: true   # NLR v2: clinical model PD-L1 + NLR
input_file: "data/0final/nlr_v2_cc50/Dati_NSCLC_nlr_v2_cc50_T0.xlsx"
input_file_t0: "data/0final/nlr_v2_cc50/Dati_NSCLC_nlr_v2_cc50_T0.xlsx"
input_file_t1: "data/0final/nlr_v2_cc50/Dati_NSCLC_nlr_v2_cc50_T1.xlsx"

# --- Experiment Iterations ---
experiments:
  BestResponse_2v3_4:
    is_longitudinal: true
    input_file:    "data/0final/nlr_v2_cc50/Dati_NSCLC_nlr_v2_cc50_T0.xlsx"
    input_file_t0: "data/0final/nlr_v2_cc50/Dati_NSCLC_nlr_v2_cc50_T0.xlsx"
    input_file_t1: "data/0final/nlr_v2_cc50/Dati_NSCLC_nlr_v2_cc50_T1.xlsx"
    # Temporal discovery/validation split (Pass 0): disabled since 2026-06-11.
    # The study develops on the full cohort with bootstrap-optimism internal
    # validation (too few events for an internal holdout); confirmation needs an
    # external cohort. Keys kept so the split can be re-enabled.
    validation_split:
      enabled:      false
      n_discovery:  73
      order_by:     "Data_inizio_terapia"
      order_format: "%d/%m/%Y"
    # v2 panel: 39 FACS markers, no soluble (Treg + soluble unavailable in the
    # validation cohort due to protocol evolution — dropped for panel coherence).
    features:
      facs:
        - "CD3tot"
        - "CD4tot"
        - "CD8tot"
        - "CM"
        - "EFF"
        - "EM"
        - "NAIVE"
        - "CD28"
        - "CD28CD4"
        - "CD28CD8"
        - "CD28KI67"
        - "CD28CM"
        - "CD28EFF"
        - "CD28EMRA"
        - "CD28NAIVE"
        - "CD137tot"
        - "CD137CD4"
        - "CD137CD8"
        - "CD137KI67"
        - "CD137PD1"
        - "CD137CM"
        - "CD137EFF"
        - "CD137EMRA"
        - "CD137NAIVE"
        - "KI67"
        - "KI67CD4"
        - "KI67CD8"
        - "KI67CM"
        - "KI67EFF"
        - "KI657EMRA"
        - "KI67NAIVE"
        - "PD1"
        - "PD1CD4"
        - "PD1CD8"
        - "PD1KI67"
        - "PD1CM"
        - "PD1EFF"
        - "PD1EMRA"
        - "PD1NAIVE"
      soluble: []
    clinical:
      target_column: "Best_response_rate_RC_1_RP_2_SD_3_PD_4"
      responder_label: "RP"
      non_responder_label: "SD_PD"
      mapping:
        RP: [2]
        SD_PD: [3, 4]
      benchmark_column: "PD_L1"
      benchmark_label: "PD-L1 expression (%)"
      sensitivity_covariates:
        - "PD_L1"
        - "Terapia_Pembro_1_Pembro_CHT_2_ipi/nivo_CHT_3;_Atezo_CHT_4"
      # Supplementary 3-way LMM (responder vs each non-responder sub-code).
      # Reveals whether the dichotomized interaction is graded or driven by
      # a single sub-group (e.g. SD behaves like RP, not like PD).
      split_nonresponder: true
    machine_learning:
      # Clinical + cytometric ADDED-VALUE layer (run_clinical_immune_added_value):
      # does the immune gate composite add predictive value beyond a pre-specified
      # clinical model? The baseline is fixed a priori, not data-selected: PD-L1 TPS
      # (the companion biomarker) stays even though it is at chance in this cohort.
      # In-fold median imputation (complete-case is the sensitivity analysis).
      #
      # Endpoint = response (primary). OS/PFS Cox = secondary, underpowered: a
      # specificity argument ("response-specific"), never a survival claim; PFS is a
      # derived proxy (no progression date exists).
      # NSCLC-specific (column names are dataset-specific); absent elsewhere → skipped.
      clinical_model:
        # NLR presence is governed by the top-level `include_nlr` switch (env INCLUDE_NLR):
        # when false, Step 06 drops the NLR entry below before building the added-value layer.
        vars:
          PD_L1: "PD_L1"
          NLR:   "neutrophils/lymphocytes"
        impute: "median"
        # ── Predictor timepoint for the immune composite (gate markers read at) ──
        #   T0    = baseline
        #   T1    = on-treatment (~3wk)
        #   delta = on-treatment change (T1-T0); needs paired longitudinal data (used: Δ frame)
        # The chosen timepoint drives the clinical_immune_added_value node + locked model + figures.
        # Secondaries are emitted additively as clinical_immune_added_value_<tp> (paired subset).
        composite_timepoint: "delta"
        # None: the T0 composite is null in this cohort (a change marker, not a baseline
        # one). Add "T0" / "T1" to emit those panels too.
        composite_secondary_timepoints: []
        # ── Defensibility sensitivities (additive; unpenalized SoC model stays PRIMARY) ──
        # 1b — ridge (L2) combined model as a CALIBRATION sensitivity: recalibrates the
        #      over-fit combined model without losing discrimination.
        calibration_ridge: true
        # 1c — enriched-baseline specification sensitivity: re-test the SAME immune composite
        #      over progressively stronger clinical baselines (label -> extra Excel columns).
        baseline_sensitivity:
          "+smoking": ["Fumatori_0_no;_1_ex;2_si"]
          "+burden":  ["n_mets_sites"]
        # 1d — specificity null: gate vs N random k-marker composites over the fixed SoC.
        specificity_null:
          n_random: 1000
        # Freeze the pre-specified clinical+immune scorer (coefficients + preprocessing
        # constants) to locked_model_<exp>.{rds,json} for prospective/temporal validation
        # on incoming patients (apply without refitting). Set false to skip the export.
        export_locked_model: true
        survival:
          os:    "OS"
          pfs:   "PFS"
          death: "Alive_0/Dead_1"
        # 1e — response-vs-survival dissociation (FigureS12_Dissociation, additional set;
        #      descriptive). Scores every predictor on BOTH endpoints with the same rank
        #      statistic and bootstraps the DIFFERENCE ("significant here, ns there" is not
        #      a dissociation).
        dissociation:
          enabled: true
          # Contrast variable: a key of clinical_model.vars, pre-specified; NEVER re-point
          # it at whichever variable gives the best contrast. null: the pre-specified
          # comparator was ECOG PS, removed from every analysis, so none is left.
          comparator: null
          # Orientation = the sign making HIGHER = BETTER outcome. MANDATORY and
          # pre-specified from biology: a variable with no entry here is skipped, because
          # orienting by the statistic it is about to be scored on manufactures the result.
          #   PD-L1 higher = better response · NLR higher = worse
          orientation:
            PD_L1: 1
            NLR: -1
          # composite_orientation: null => taken from the pre-specified LMM interaction sign
          # (responders contract the gate => lower delta is responder-like => -1).
          composite_orientation: null
          n_boot: 2000
          mediation_sim: true
        # ── Publication nomograms (FigureS9_* stems; apparent fit, not validated) ──
        #   Two point-based nomograms are rendered in the publication set:
        #     (A) the LMM gate markers as individual predictors — per-marker display read;
        #     (B) the 1-df immune composite + clinical vars = the combined model of the LRT.
        #   null => B follows THIS run's own clinical vars, i.e. `include_nlr` drives it
        #   (primary → PD-L1; NLR run → PD-L1 + NLR). Do NOT hard-code a subset here: B
        #   must stay identical to the model the run actually tests, otherwise the
        #   nomogram draws a model the paper never tested.
        #   Set a list only to deliberately draw a sub-model (display-only).
        nomogram:
          clinical_vars: null

