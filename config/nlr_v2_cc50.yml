# --- Quality Control ---
qc:
  max_na_row_pct: 0.40       
  max_na_col_facs_pct: 0.20  
  max_na_col_sol_pct: 0.50   
  max_na_covariates: 0.10
  remove_outliers: true
  outlier_conf_level: 0.99

# --- Transformation & Imputation ---
transformation:
  facs_method: "logit"       
  facs_format: "percentage"  
  soluble_method: "log2"     
  epsilon: 1e-4         

stats:
  seed: 2026

# --- Longitudinal Bootstrap (Step 04, optional) ---
# Patient-level cluster bootstrap of LMM interaction betas. Adds bootstrap
# 95% CI + %FDR<0.05 to the JSON/Excel report and a forest plot PDF.
# Computationally heavy (n_boot=500 is the value behind the reported numbers);
# set n_boot lower for quick checks. Skipped when no FDR-significant markers.
lmm_bootstrap:
  enabled: true
  n_boot: 500
  seed: 2026

# --- Multivariate Analysis (sPLS-DA) ---
multivariate:
  n_comp: 2
  validation_folds: 5
  n_repeat_cv: 50
  top_n_loadings: 15
  # Empirical null distribution of the BER under shuffled outcome. Defends
  # against the "is the BER actually above chance?" reviewer question.
  # 200 perms with n_repeat=1 is ~3-5 min on this panel size.
  permutation:
    enabled: true
    n_perm: 200
    n_repeat: 1

# --- Post hoc analyses (step 07, src/07_post_hoc.R) ---
# Run after step 06 on the run's own frames with the gate fixed; sensitivity /
# descriptive only. Each block can be switched off with enabled: false.
post_hoc:
  grouping:                    # PR / SD / PD grouping of the LMM frame (+ disease-control gate)
    enabled: true
    subcodes: {PR: 2, SD: 3, PD: 4}   # best-response codes of clinical.target_column
  duplicate_rows:              # identical T1 rows (two persons): drop each, then both
    enabled: true
    drop_t1: [NSCLC_10, NSCLC_12]
  therapy:                     # ICI monotherapy vs chemo-immunotherapy (parser v3.1 regimen)
    enabled: true
    file_t0: "data/therapy_fix/Dati_NSCLC_standardizzati_latest_anonimi_therapyfix_T0.xlsx"
    file_t1: "data/therapy_fix/Dati_NSCLC_standardizzati_latest_anonimi_therapyfix_T1.xlsx"
    tag: "v3.1"                # therapy data version (parser v3.1, 2026-10-27)
    B: 10000                   # within-regimen permutations
    seed: 56
  km:                          # Kaplan-Meier OS / PFS by median split of the Δ composite
    enabled: true
    landmark_days: 21          # T1 landmark (after the 1st cycle)

# --- Figure export (save_figure(), R/utils_figures.R) ---
# formats: any of pdf (cairo, default), png / tiff (ragg; tiff LZW), svg (cairo).
# dpi applies to the raster formats. Multipage figures: one pdf, one raster/svg file per page.
figures:
  formats: [pdf]
  dpi: 300

# --- Publication set (collect_publication(), R/utils_publication.R) ---
# Copied from the step dirs into <run>/publication/{main,supplementary,supplementary/tables,
# additional}/ at the end of main.R, with publication/INDEX.md. Labels are provisional and
# name the copies (label "Figure 2" -> Fig_2_<name>; name defaults to the stem without its
# Figure<N>_ prefix); the step outputs keep their stems.
# frame: {key} = N of this run (t0_standard, lmm_patients, lmm_obs, lmm_paired, delta,
# delta_pos, delta_complete_case, t0_pdl1_valid). A missing main/supplementary file is FATAL.
publication:
  main:
    - {stem: Figure1_Biology, from: 06_machine_learning/publication, label: "Figure 1",
       producer: "pub_fig_biology + pub_fig_lmm_forest",
       frame: "A: Δ frame, n = {delta}; B: LMM frame, {lmm_patients} patients / {lmm_obs} obs"}
    - {stem: Figure2b_AddedValue_CVcurves, from: 06_machine_learning/publication, label: "Figure 2",
       producer: "pub_fig_added_value(curves = \"cv\")", frame: "Δ frame, n = {delta} ({delta_pos} PR)"}
    - {stem: FigureS9b_Nomogram_FullRangeAxes, from: 06_machine_learning/publication, label: "Figure 3",
       producer: "pub_fig_nomogram_hybrid", frame: "Δ frame, n = {delta} (apparent fit, not validated)"}
    - {stem: FigureKM_DeltaComposite_OS_PFS, from: 07_post_hoc/km, label: "Figure 4",
       producer: "pub_fig_km_panels (src/07_post_hoc.R)", frame: "Δ frame, n = {delta}; post hoc, descriptive"}
  supplementary:
    - {stem: FigureS1_CONSORT, from: 06_machine_learning/publication, label: "Figure S1",
       producer: "pub_fig_consort",
       frame: "T0 n = {t0_standard}; LMM {lmm_patients} patients / {lmm_obs} obs; Δ n = {delta}"}
    - {stem: FigureS7_Calibration_IDI, from: 06_machine_learning/publication, label: "Figure S2",
       producer: "pub_fig_calibration_idi", frame: "Δ frame, n = {delta}"}
    - {stem: FigureT_TherapyChange, from: 07_post_hoc/therapy, label: "Figure S3",
       producer: "pub_fig_therapy_change(adjusted = TRUE) (src/07_post_hoc.R)",
       frame: "paired LMM patients with a known regimen (of {lmm_paired} paired); n per group in therapy/console.txt"}
  tables:
    - {stem: Longitudinal_LMM_Report, from: 04_longitudinal_analysis, type: xlsx, label: "Table S1",
       producer: "src/04_longitudinal_lmm.R", frame: "LMM frame, {lmm_patients} patients / {lmm_obs} obs"}
    - {stem: ML_Classification_Report, from: 06_machine_learning, type: xlsx, label: "Table S2",
       producer: "src/06_machine_learning.R", frame: "T0 n = {t0_standard}; Δ n = {delta}"}
  additional:
    - {stem: Figure2_AddedValue, name: AddedValue_LOOcurves, from: 06_machine_learning/publication, producer: "pub_fig_added_value(curves = \"loo\")", frame: "Δ frame, n = {delta}"}
    - {stem: Figure3_PDL1_context, from: 06_machine_learning/publication, producer: "pub_fig_pdl1_context", frame: "T0 frame, n = {t0_standard} ({t0_pdl1_valid} with PD-L1)"}
    - {stem: FigureS2_BaselineInvariance, from: 06_machine_learning/publication, producer: "pub_fig_baseline_invariance", frame: "Δ frame, n = {delta}"}
    - {stem: FigureS3_SpecificityNull, from: 06_machine_learning/publication, producer: "pub_fig_specificity_null", frame: "Δ frame, n = {delta}"}
    - {stem: FigureS4_StandaloneClassifier, from: 06_machine_learning/publication, producer: "pub_fig_standalone", frame: "T0 frame, n = {t0_standard}"}
    - {stem: FigureS5_Coupling, from: 06_machine_learning/publication, producer: "pub_fig_coupling", frame: "Δ frame, n = {delta}"}
    - {stem: FigureS6_Robustness, from: 06_machine_learning/publication, producer: "pub_fig_robustness", frame: "Δ frame, n = {delta}"}
    - {stem: FigureS8_GateSignal, from: 06_machine_learning/publication, producer: "pub_fig_gate_signal", frame: "paired patients, n = {delta}"}
    - {stem: FigureS9_Nomogram, from: 06_machine_learning/publication, producer: "pub_fig_nomogram", frame: "Δ frame, n = {delta}"}
    - {stem: FigureS10_Classification, from: 06_machine_learning/publication, producer: "pub_fig_classification", frame: "Δ frame, n = {delta}"}
    - {stem: FigureS11_FoldChange, from: 06_machine_learning/publication, producer: "pub_fig_foldchange", frame: "paired patients, n = {delta}"}
    - {stem: FigureS12_Dissociation, from: 06_machine_learning/publication, producer: "pub_fig_dissociation", frame: "Δ frame, n = {delta}; descriptive"}
    - {stem: FigureT_TherapyChange_unadjusted, from: 07_post_hoc/therapy, producer: "pub_fig_therapy_change(adjusted = FALSE)", frame: "paired LMM patients with a known regimen; raw means (not a valid ranking)"}
    - {stem: SelectionAware_LRT, from: 06_machine_learning, type: csv, producer: "run_selection_aware_lrt", frame: "LMM {lmm_patients} patients (selection); Δ n = {delta} (LRT)"}
    - {stem: PatientBootstrap_AUC, from: 06_machine_learning, type: csv, producer: "run_patient_bootstrap_auc", frame: "Δ frame, n = {delta}"}
    - {stem: LRT_LeaveOneOut, from: 06_machine_learning, type: csv, producer: "run_lrt_leave_one_out", frame: "Δ frame, n = {delta}"}

# --- Visualization & Colors ---
# EXPANDED: Contains all possible labels injected by the mini-configs
colors:
  groups:
    # Best Response labels
    RP: "#2E8B57"            # Green
    SD_PD: "#B2182B"         # Red
    # Legacy fallbacks
    Responder: "#2E8B57"
    Non_Responder: "#B2182B"
  plsda:
    positive: "#B2182B"
    negative: "#2E8B57"
  heatmap:
    low: "#2166AC"
    mid: "#F7F7F7"
    high: "#B2182B"

# --- Machine Learning Classification (Step 06) ---
# Global switch applied to all experiments. Step 06 auto-detects whether each
# experiment has LOO-robust features (FDR + LOO gate from Step 04) and degrades
# gracefully when none are found — no per-experiment flag needed.
machine_learning:
  fdr_threshold: 0.05          # FDR cutoff for LMM feature gate
  loo_threshold: 0.05          # Max LOO p-value cutoff for LMM feature gate
  n_perm: 2000                 # Permutations for empirical AUC p-value (floor = 1/n_perm)
  collinearity_threshold: 0.85 # Drop one of any marker pair with |r| > threshold (0.85 = automatic; set to 1 to disable)
  include_interactions: false  # Disabled: SVM-RBF captures non-linear interactions via kernel; explicit terms add collinear noise

  clinical_utility:            # Clinical-utility layer (run_clinical_utility) — calibration/DCA/optimism on the pre-specified composite
    n_boot: 2000               # Harrell enhanced-bootstrap reps for optimism correction

  # Inference on the clinical+immune increment (step 06, section 12e). Seeds and B are the
  # values behind the reported numbers; changing them changes the numbers.
  clinical_immune_added_value:
    selection_aware_lrt:       # THE reportable p: label permutation with full gate re-selection
      enabled: true
      B: 10000                 # ~40 min on 15 cores
      topk: gate_size          # top-K rule, K = observed gate size (the rule the Methods describe)
      cores: 15                # results do not depend on it (permutations drawn before the parallel loop)
      seed: 2026
    patient_bootstrap:         # THE reported CIs for the CV AUCs and dAUC (cv_kfold$delta_auc_ci is NOT a CI)
      enabled: true
      B: 2000                  # ~10 min on 15 cores
      reps_in_boot: 10         # CV repetitions inside each resample
      cores: 15
      seed: 2026
    lrt_leave_one_out:         # fixed-gate LRT dropping one patient at a time (deterministic)
      enabled: true

  glmnet:
    alpha_grid: [0.0, 0.5, 1.0] # Tuned in inner CV: Ridge, Elastic Net, LASSO
    n_lambda: 100
    inner_folds: 5

  svm:
    C_grid: [0.01, 0.1, 1, 10, 100]
    gamma_grid: [0.01, 0.1, 1, 10]
    inner_folds: 5

  output:
    top_n_features: 10
