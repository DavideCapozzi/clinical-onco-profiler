# ==============================================================================
# BASE CONFIGURATION: clinical-onco-profiler (Global Parameters)
# ==============================================================================

# --- System Setup ---
output_root: "results"
project_name: "base_run"
run_machine_learning: true
run_nested_loocv_validation: true
run_clinical_utility: true       # Step 06: calibration + decision curve + bootstrap optimism on the pre-specified composite (TRIPOD/REMARK layer)
run_nested_validation: true      # Step 06: re-select the LMM gate inside each outer LOO fold (anti-circularity / selection-optimism test); NSCLC only (needs clinical_model + longitudinal); ~1 min, additive
run_publication_figures: true    # Step 06: Frontiers-styled manuscript figure set (publication/ subdir; cairo_pdf, no titles, Okabe-Ito) — additive, driven by live objects
# NLR toggle — single switch for the with-/without-NLR runs; run them SEPARATELY.
#   false = clinical model = PD-L1 + PS  → THE MAIN-TEXT HEADLINE *and* the deployment scorer
#           (default since 2026-07-15). NLR is UNUSABLE prospectively: unavailable for some
#           patients and ~17% median-imputed here. Headline (cv_kfold, Delta n=49):
#           PD-L1+PS 0.543 -> +immune 0.780, increment +0.223 [0.173, 0.280],
#           LRT chi2=16.98 p=3.787e-05 (the LRT uses NO cross-validation).
#   true  = PD-L1 + NLR + PS → the SUPPLEMENTARY specificity run ("the immune signal is not a
#           proxy for standard prognostics, incl. NLR"): 0.6396 -> 0.8156, LRT p=4.211e-05.
# main.R auto-labels the run dir with_nlr / no_nlr. Override per-run without editing this file:
#   INCLUDE_NLR=true Rscript main.R
#
# ⚠ RETRACTED 2026-07-15 — the old note here read "PD-L1+PS is a LOO-degenerate baseline
#   (diag_24) → the no-NLR increment is INFLATED; NOT the incremental-value claim". That
#   degeneracy was a **LOO tie-breaking artifact**, not a property of the data (diag_41): the LOO
#   deficit tracks the fraction of TIED patient pairs — the immune composite (0% ties) shows NO
#   deficit (0.771 vs 0.778), PS (44% ties) collapses 0.424 vs 0.551, PD-L1 (14%) 0.237 vs 0.393.
#   Under repeated stratified 10-fold, PD-L1+PS on Delta is 0.543 — ABOVE chance, NOT degenerate
#   → the NLR-free increment IS interpretable and IS the claim. See the cv_kfold JSON node.
#   STILL TRUE at T0 (0.440, degenerate even under 10-fold) → T0 dropped from the main text.
#   STILL TRUE: increments are NOT comparable across baselines — NLR-free +0.223 > with-NLR
#   +0.176 is the diag_24 degradation effect (weaker baseline ⇒ bigger increment), not more value.
include_nlr: false
input_file: "data/Dati_NSCLC_standardizzati_anonimi_T0.xlsx"
input_file_t0: "data/Dati_NSCLC_standardizzati_anonimi_T0.xlsx"
input_file_t1: "data/Dati_NSCLC_standardizzati_anonimi_T1.xlsx"

# --- Experiment Iterations ---
experiments:
  BestResponse_2v3_4:
    is_longitudinal: true
    run_network: true
    input_file:    "data/Dati_NSCLC_standardizzati_latest_anonimi_T0.xlsx"
    input_file_t0: "data/Dati_NSCLC_standardizzati_latest_anonimi_T0.xlsx"
    input_file_t1: "data/Dati_NSCLC_standardizzati_latest_anonimi_T1.xlsx"
    # Temporal discovery/validation split (Pass 0) — DISABLED 2026-06-11.
    # The added-value study develops on the FULL cohort with bootstrap-optimism
    # internal validation: with only ~36 events (minority class) an internal
    # holdout is the wrong tool (development needs ~40 events, separate validation
    # ~100 → ~330 patients to split; full-cohort+bootstrap uses every event).
    # diag_18 (split trade-off) + diag_19 (full vs discovery) document this; the
    # added-value IDI still excludes 0 on the full cohort. True confirmation =
    # external cohort. Keys retained (disabled) so the split can be re-enabled.
    # n_discovery=73 lands on the 102-day enrollment gap (balanced 6:6, NSCLC_80-91).
    validation_split:
      enabled:      false
      n_discovery:  73
      order_by:     "Data_inizio_terapia"
      order_format: "%d/%m/%Y"
    # v2 panel: 39 FACS markers, no soluble (Treg + soluble unavailable in the
    # validation cohort due to protocol evolution — dropped for panel coherence).
    features:
      facs:
        - "CD3tot"
        - "CD4tot"
        - "CD8tot"
        - "CM"
        - "EFF"
        - "EM"
        - "NAIVE"
        - "CD28"
        - "CD28CD4"
        - "CD28CD8"
        - "CD28KI67"
        - "CD28CM"
        - "CD28EFF"
        - "CD28EMRA"
        - "CD28NAIVE"
        - "CD137tot"
        - "CD137CD4"
        - "CD137CD8"
        - "CD137KI67"
        - "CD137PD1"
        - "CD137CM"
        - "CD137EFF"
        - "CD137EMRA"
        - "CD137NAIVE"
        - "KI67"
        - "KI67CD4"
        - "KI67CD8"
        - "KI67CM"
        - "KI67EFF"
        - "KI657EMRA"
        - "KI67NAIVE"
        - "PD1"
        - "PD1CD4"
        - "PD1CD8"
        - "PD1KI67"
        - "PD1CM"
        - "PD1EFF"
        - "PD1EMRA"
        - "PD1NAIVE"
      soluble: []
    clinical:
      target_column: "Best_response_rate_RC_1_RP_2_SD_3_PD_4"
      responder_label: "RP"
      non_responder_label: "SD_PD"
      mapping:
        RP: [2]
        SD_PD: [3, 4]
      benchmark_column: "PD_L1"
      benchmark_label: "PD-L1 expression (%)"
      sensitivity_covariates:
        - "PD_L1"
        - "PS_prima_immuno"
        - "Terapia_Pembro_1_Pembro_CHT_2_ipi/nivo_CHT_3;_Atezo_CHT_4"
      # Supplementary 3-way LMM (responder vs each non-responder sub-code).
      # Reveals whether the dichotomized interaction is graded or driven by
      # a single sub-group (e.g. SD behaves like RP, not like PD).
      split_nonresponder: true
    machine_learning:
      # Clinical + cytometric ADDED-VALUE layer (run_clinical_immune_added_value):
      # does the immune gate composite add predictive value BEYOND a pre-specified
      # standard-of-care clinical model? Baseline LOCKED from NSCLC-ICI literature,
      # NOT data-selected — dropping PD-L1 would be a fatal reviewer critique (it is
      # the FDA companion biomarker), so PD-L1 stays even though it is at CHANCE here
      # (direction-optimised rank AUC 0.508) — its failure is the study's MOTIVATION.
      # In-fold median imputation (complete-case is the sensitivity analysis).
      #
      # ⚠ 2026-07-15 — the "NLR is LOAD-BEARING / PD-L1+PS is a DEGENERATE LOO baseline
      # (0.49Δ / 0.31 T0)" rationale that lived here is RETRACTED: those sub-chance LOO
      # values are a TIE-BREAKING ARTIFACT (diag_41), not anti-prediction. Under repeated
      # stratified 10-fold PD-L1+PS on Delta is 0.543 (above chance) → the NLR-free
      # baseline is the MAIN-TEXT one (top-level include_nlr: false). See that key.
      # Retained from the old note: increments are NOT comparable across baselines, and
      # T0's NLR-free baseline IS genuinely degenerate (0.440) → T0 dropped from main.
      #
      # Endpoint = response (primary). OS/PFS Cox = secondary and NULL — it is a
      # SPECIFICITY argument ("response-specific, not a proxy for general prognosis"),
      # never a survival claim; PFS is a DERIVED PROXY (no progression date exists).
      # NSCLC-specific (column names are dataset-specific); absent elsewhere → skipped.
      clinical_model:
        # NLR presence is governed by the top-level `include_nlr` switch (env INCLUDE_NLR):
        # when false, Step 06 drops the NLR entry below before building the added-value layer.
        vars:
          PD_L1: "PD_L1"
          NLR:   "neutrophils/lymphocytes"
          PS:    "PS_prima_immuno"
        impute: "median"
        # ── Predictor timepoint for the immune composite (gate markers read at) ──
        #   T0    = baseline, deployable at diagnosis (PRIMARY; canonical, full n)
        #   T1    = on-treatment (~3wk)
        #   delta = on-treatment change (T1-T0); needs paired longitudinal data
        # Primary drives the stable clinical_immune_added_value node + locked model + figures.
        # Secondaries are emitted additively as clinical_immune_added_value_<tp> (paired subset).
        composite_timepoint: "delta"
        composite_secondary_timepoints: ["T0"]
        # ── Defensibility sensitivities (additive; unpenalized SoC model stays PRIMARY) ──
        # 1b — ridge (L2) combined model as a CALIBRATION sensitivity: recalibrates the
        #      over-fit combined model (slope ~0.66 -> ~0.9) without losing discrimination.
        calibration_ridge: true
        # 1c — enriched-baseline specification sensitivity: re-test the SAME immune composite
        #      over progressively stronger clinical baselines (label -> extra Excel columns).
        baseline_sensitivity:
          "+smoking": ["Fumatori_0_no;_1_ex;2_si"]
          "+burden":  ["n_mets_sites"]
        # 1d — specificity null: gate vs N random k-marker composites over the fixed SoC.
        specificity_null:
          n_random: 1000
        # Freeze the pre-specified clinical+immune scorer (coefficients + preprocessing
        # constants) to locked_model_<exp>.{rds,json} for prospective/temporal validation
        # on incoming patients (apply without refitting). Set false to skip the export.
        export_locked_model: true
        survival:
          os:    "OS"
          pfs:   "PFS"
          death: "Alive_0/Dead_1"
        # ── Publication nomograms (Figure S10) ──
        #   Two point-based nomograms are rendered in the publication set:
        #     (A) the LMM gate markers as individual predictors — per-marker display read;
        #     (B) the 1-df immune composite + clinical vars = the FORMAL model, so its
        #         probability is the one Fig 2 validates (reported with its LOO AUC).
        #   null => B follows THIS run's own clinical vars, i.e. `include_nlr` drives it
        #   (no_nlr → PD-L1+PS = the main-text model; with_nlr → PD-L1+NLR+PS). Do NOT
        #   hard-code a subset here: B must stay identical to the model the run actually
        #   validates, otherwise the nomogram draws a model the paper never tested.
        #   Set a list only to deliberately draw a sub-model (display-only).
        nomogram:
          clinical_vars: null

  Comorbidity_1v0:
    enabled: false   # closed NO-GO (diag_22), negative control — retained for record
    is_longitudinal: true
    run_network: false
    clinical:
      target_column: "comorbidità_No_0_Si_1"
      responder_label: "Comorb_Yes"
      non_responder_label: "Comorb_No"
      mapping:
        Comorb_Yes: [1]
        Comorb_No:  [0]

  Toxicity_1v0:
    enabled: false   # closed NO-GO (diag_22), null outcome — retained for record
    is_longitudinal: true
    run_network: false
    clinical:
      target_column: "tossicità_da_immuno_No_0_Si_1"
      responder_label: "Tox_Yes"
      non_responder_label: "Tox_No"
      mapping:
        Tox_Yes: [1]
        Tox_No:  [0]

  HNSCC_Response:
    input_file:    "data/Dati_HNSCC_standardizzati_anonimi.xlsx"
    input_file_t0: "data/Dati_HNSCC_standardizzati_anonimi.xlsx"
    is_longitudinal: false
    run_network: false       # network.feature_selection.always_include uses NSCLC-only markers
    clinical:
      target_column:       "Clinical_Response"
      responder_label:     "R"
      non_responder_label: "NR"
      benchmark_column:    "CPS"
      benchmark_label:     "CPS score"
    machine_learning:
      gate_method:              "univariate"
      univariate_fdr_threshold: 0.20
      univariate_fallback_k:    3
      n_perm:                   999
      # CPS stratification cutoffs for the HNSCC anti-PD-1 benchmark (config-driven;
      # a new cohort/benchmark re-bins here without code edits). These reproduce the
      # historical hard-coded defaults: neg(<1), low(1-19), high(>=20).
      benchmark_strata:
        breaks:         [0.5, 19.5]
        labels:         ["neg(<1)", "low(1-19)", "high(>=20)"]
        high_threshold: 20
    features:
      facs:
        - "M_MDSC"
        - "LOX1_PMN_MDSC"
        - "T_reg"
        - "Resting"
        - "Active"
        - "Non_suppressive"
        - "TregCD137"
        - "CM"
        - "EFF"
        - "EM"
        - "NAIVE"
        - "CD137tot"
        - "CD137CD4"
        - "CD137CD8"
        - "CD137PD1"
        - "CD137CM"
        - "CD137EFF"
        - "CD137EMRA"
        - "CD137NAIVE"
        - "PD1"
        - "PD1CD4"
        - "PD1CD8"
        - "PD1CM"
        - "PD1EFF"
        - "PD1EMRA"
        - "PD1NAIVE"
      soluble:
        - "sBTLA"
        - "sCD137"
        - "sCD152"
        - "sCD27"
        - "sCD28"
        - "sCD80"
        - "sGITR"
        - "sHVEM"
        - "sIDO"
        - "sLAG_3"
        - "sPD_1"
        - "sPD_L2"
        - "sTIM_3"

