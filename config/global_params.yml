# --- Quality Control ---
qc:
  max_na_row_pct: 0.40       
  max_na_col_facs_pct: 0.20  
  max_na_col_sol_pct: 0.50   
  max_na_covariates: 0.10
  remove_outliers: true
  outlier_conf_level: 0.99

# --- Transformation & Imputation ---
transformation:
  facs_method: "logit"       
  facs_format: "percentage"  
  soluble_method: "log2"     
  epsilon: 1e-4         

stats:
  seed: 2026

# --- Longitudinal Bootstrap (Step 04, optional) ---
# Patient-level cluster bootstrap of LMM interaction betas. Adds bootstrap
# 95% CI + %FDR<0.05 to the JSON/Excel report and a forest plot PDF.
# Computationally heavy: ~13 min for n_boot=500 on a 47-marker panel; set
# n_boot lower for quick checks. Skipped when no FDR-significant markers.
lmm_bootstrap:
  enabled: true
  n_boot: 500
  seed: 2026

# --- Multivariate Analysis (sPLS-DA) ---
multivariate:
  n_comp: 2
  validation_folds: 5
  n_repeat_cv: 50
  top_n_loadings: 15
  # Empirical null distribution of the BER under shuffled outcome. Defends
  # against the "is BER ~ 0.45 actually above chance?" reviewer question.
  # 200 perms with n_repeat=1 is ~3-5 min on this panel size.
  permutation:
    enabled: true
    n_perm: 200
    n_repeat: 1

# --- Visualization & Colors ---
# EXPANDED: Contains all possible labels injected by the mini-configs
colors:
  groups:
    # Toxicity labels
    Tox_Yes: "#B2182B"       # Red
    Tox_No: "#2E8B57"        # Green
    # Best Response labels
    RP: "#2E8B57"            # Green
    SD_PD: "#B2182B"         # Red
    # Comorbidity labels
    Comorb_Yes: "#B2182B"    # Red
    Comorb_No: "#2E8B57"     # Green
    # HNSCC labels
    R:  "#2E8B57"              # Green (responder)
    NR: "#B2182B"              # Red (non-responder)
    # Legacy fallbacks
    Responder: "#2E8B57"
    Non_Responder: "#B2182B"
  plsda:
    positive: "#B2182B"
    negative: "#2E8B57"
  heatmap:
    low: "#2166AC"
    mid: "#F7F7F7"
    high: "#B2182B"

# --- Machine Learning Classification (Step 06) ---
# Global switch applied to all experiments. Step 06 auto-detects whether each
# experiment has LOO-robust features (FDR + LOO gate from Step 04) and degrades
# gracefully when none are found — no per-experiment flag needed.
machine_learning:
  fdr_threshold: 0.05          # FDR cutoff for LMM feature gate
  loo_threshold: 0.05          # Max LOO p-value cutoff for LMM feature gate
  n_perm: 2000                 # Permutations for empirical AUC p-value (floor = 1/n_perm)
  collinearity_threshold: 0.85 # Drop one of any marker pair with |r| > threshold (0.85 = automatic; set to 1 to disable)
  include_interactions: false  # Disabled: SVM-RBF captures non-linear interactions via kernel; explicit terms add collinear noise

  clinical_utility:            # Clinical-utility layer (run_clinical_utility) — calibration/DCA/optimism on the pre-specified composite
    stability_pct: 50          # univariate path only: include markers selected in >= this % of outer folds (conservative)
    n_boot: 2000               # Harrell enhanced-bootstrap reps for optimism correction

  glmnet:
    alpha_grid: [0.0, 0.5, 1.0] # Tuned in inner CV: Ridge, Elastic Net, LASSO
    n_lambda: 100
    inner_folds: 5

  svm:
    C_grid: [0.01, 0.1, 1, 10, 100]
    gamma_grid: [0.01, 0.1, 1, 10]
    inner_folds: 5

  output:
    top_n_features: 10

# --- Differential Network Analysis (Step 05) ---
# Activated per-experiment via run_network: true in the experiments block.
network:
  n_boot: 1000                 # Bootstrap iterations for baseline stability
  n_perm: 2000                 # Permutation iterations for differential testing (p-value floor 0.0005)
  n_cores: "auto"              # "auto" uses all available cores - 1; or set to a fixed integer
  threshold_type: "absolute"   # "absolute" or "percentile"
  edge_threshold: 0.075        # Minimum |pcor| for a valid edge — lower threshold recovers weak inverted edges
  min_marginal_cor: 0.10       # Minimum delta Pcor for differential significance
  min_network_n: 3             # Minimum samples per group to attempt network inference
  cytoscape_export:            # Baseline network export filters
    min_stability_freq: 0.90   # Edge must appear in ≥90% of bootstrap iterations
    min_abs_pcor: 0.075        # Minimum |pcor| for Cytoscape export (aligned with edge_threshold)
    max_export_edges: 40       # Maximum edges in main Cytoscape file (rest go to remaining/)
  cytoscape_export_diff:       # Differential network export filters
    exclude_conserved: false   # Whether to exclude conserved edges from export
    min_stability_freq_any: 0.90
    min_diff_score: 0.10
    max_export_edges: 40
  feature_selection:           # sPLS-DA-guided panel reduction before network inference
    enabled: true
    method: "splsda_loadings"  # Retain markers with |loading| > min_abs_loading in Step 03
    min_abs_loading: 0.0       # 0 = any marker selected by sPLS-DA in at least one component
    min_features: 8            # Safety floor; reverts to full panel if selection is smaller
    always_include:            # Structural backbone: parent lineage + memory phenotypes
      - "CD3tot"               # Total T cells — anchor for lineage interpretation
      - "CD4tot"
      - "CD8tot"
      - "CM"                   # Central memory
      - "EFF"                  # Effector
      - "EM"                   # Effector memory
      - "NAIVE"
      - "KI657EMRA"            # Terminally differentiated EMRA (note: field name typo in source data)
