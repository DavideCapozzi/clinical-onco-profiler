# Direct dependencies of the pipeline, pinned to the versions of the environment that
# produced the reported results. The exact environment (every package and build) is
# env/environment.lock.yml (linux-64):
#   micromamba create -n clinical-onco-profiler -f env/environment.lock.yml
# r-logistf (Firth LRT) is optional and deliberately absent: the reported runs were
# produced without it (lrt_firth_p = NA); installing it adds that field to the outputs.
name: clinical-onco-profiler

channels:
  - conda-forge
  - bioconda
  - nodefaults

dependencies:
  - r-base=4.3.3

  # data input / output
  - r-readxl=1.4.5
  - r-openxlsx=4.2.8
  - r-writexl=1.5.4
  - r-yaml=2.3.10
  - r-jsonlite=2.0.0
  - r-here=1.0.1
  - r-xml2=1.4.0               # curated-database build (data package)
  - r-zip=2.3.3

  # data handling and figures
  - r-tidyverse=2.0.0
  - r-scales=1.4.0
  - r-patchwork=1.3.2
  - r-ggrepel=0.9.6
  - r-ragg=1.5.0
  - r-circlize=0.4.16
  - r-factominer=2.12
  - r-factoextra=1.0.7
  - bioconductor-complexheatmap=2.18.0
  - poppler=26.02.0            # pdftocairo: png / tiff / jpeg / svg / eps copies of the publication pdfs

  # statistics and models
  - r-lme4=1.1_37
  - r-lmertest=3.1_3
  - r-emmeans=1.11.2_8
  - r-survival=3.8_3
  - r-proc=1.19.0.1
  - r-glmnet=4.1_10
  - r-e1071=1.7_16
  - bioconductor-mixomics=6.26.0
  - bioconductor-pcamethods=1.94.0
